# nginx in front of PHP-FPM, serving only public/.
#
# The document root matters more here than anywhere else in this file. The
# application keeps uploaded evidence in storage/app/private, outside the
# web root, and streams it through a controller that checks who is asking.
# Pointing nginx at the project root instead of public/ would serve those
# files directly to anyone who guessed a filename, and .env with them.

user www-data;
worker_processes auto;
error_log /dev/stderr warn;
pid /run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # To the container's stdout, so `docker logs` is the log.
    access_log /dev/stdout;

    sendfile      on;
    tcp_nopush    on;
    tcp_nodelay   on;
    server_tokens off;

    keepalive_timeout 65;

    # Must not be lower than PHP's post_max_size, or nginx refuses a large
    # attachment before PHP can explain why.
    client_max_body_size 16M;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml image/svg+xml;

    server {
        listen 80 default_server;
        server_name _;

        root /var/www/html/public;
        index index.php;

        charset utf-8;

        # The host sits behind a proxy that terminates TLS. Laravel reads
        # these to build absolute URLs and to know the request was secure.
        real_ip_header X-Forwarded-For;
        set_real_ip_from 0.0.0.0/0;

        location / {
            try_files $uri $uri/ /index.php?$query_string;
        }

        location = /favicon.ico { access_log off; log_not_found off; }
        location = /robots.txt  { access_log off; log_not_found off; }

        # Everything PHP goes to one front controller. A request for any
        # other .php file is a request for a file this application does not
        # have.
        location ~ ^/index\.php(/|$) {
            fastcgi_pass 127.0.0.1:9000;
            fastcgi_split_path_info ^(.+\.php)(/.*)$;
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            fastcgi_param PATH_INFO $fastcgi_path_info;
            fastcgi_param HTTPS $http_x_forwarded_proto;
            fastcgi_hide_header X-Powered-By;
            fastcgi_read_timeout 60;
        }

        location ~ \.php$ {
            return 404;
        }

        # Nothing that starts with a dot is ever served -- .env, .git and
        # whatever else lands in the directory one day.
        location ~ /\. {
            deny all;
            access_log off;
            log_not_found off;
        }

        location ~* \.(?:css|js|woff2?|ttf|otf|eot|svg|png|jpe?g|gif|webp|ico)$ {
            expires 30d;
            access_log off;
            add_header Cache-Control "public, immutable";
            try_files $uri =404;
        }
    }
}
