; nginx and PHP-FPM, kept alive together.
;
; Both log to the container's own stdout and stderr rather than to files
; inside it: a log written to a layer that is thrown away on the next
; deploy is a log nobody reads. `docker logs` is the log.
;
; nodaemon=true because supervisor is PID 1 here. A supervisor that
; daemonises would exit immediately and take the container with it.

[supervisord]
nodaemon=true
user=root
logfile=/dev/null
logfile_maxbytes=0
pidfile=/run/supervisord.pid

[program:php-fpm]
command=php-fpm --nodaemonize
autostart=true
autorestart=true
; Either process dying should stop the container, not leave it serving
; half an application: an nginx with no interpreter behind it answers
; every request with 502 while the health check still finds a listener.
startretries=3
priority=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:nginx]
command=nginx -g "daemon off;"
autostart=true
autorestart=true
startretries=3
priority=20
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
