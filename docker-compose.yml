# The two containers the hosting request asks for.
#
#   cspcconcern-app  nginx + PHP-FPM serving the application
#   cspcconcern-db   MySQL holding accounts, concerns, notes and the audit trail
#
# Start it with:  docker compose up -d --build
# Then open:      http://localhost:8002

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cspcconcern-app
    restart: unless-stopped

    # ONE env file, the same one XAMPP reads.
    #
    # There were two, and keeping them in step was a job nobody was doing:
    # a Google secret rotated in .env and not in .env.docker meant sign-in
    # worked in one and failed in the other, for no visible reason. The
    # file holds what the two have in common -- the key, the mail password,
    # the Google client -- and everything below overrides what they cannot
    # share.
    #
    # `environment:` beats `env_file:` in Compose, which is what makes this
    # work: .env says 127.0.0.1 and the block below says db, and the
    # container gets db.
    env_file:
      - .env

    environment:
      # Inside this network the database answers to "db". localhost here is
      # the application container itself, which has no database in it.
      # Read from the DOCKER_ block at the bottom of .env, so a port or a
      # password is changed in one file and this one is never opened.
      #
      # The prefix is what makes that safe. Named DB_DATABASE these would
      # collide with the XAMPP settings in the same file -- Compose
      # substitutes from .env too -- and the container would be handed the
      # local database name, which does not exist inside it. That is
      # exactly the trap this hit the first time.
      #
      # DB_HOST stays literal: inside this network the database answers to
      # "db", and that is a fact about the network rather than a setting.
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: "${DOCKER_DB_DATABASE:-cspcconcern}"
      DB_USERNAME: "${DOCKER_DB_USERNAME:-cspcconcern}"
      DB_PASSWORD: "${DOCKER_DB_PASSWORD:-secret}"

      # The address this one answers on, which is not the one artisan serve
      # answers on. Both are needed: APP_URL builds links, APP_PUBLIC_URL
      # is what goes in emails.
      APP_URL: "${DOCKER_APP_URL:-http://localhost:8002}"
      APP_PUBLIC_URL: "${DOCKER_APP_URL:-http://localhost:8002}"
      GOOGLE_REDIRECT_URI: "${DOCKER_APP_URL:-http://localhost:8002}/auth/google/callback"

      # A deployment shape, not a workbench: no debug screens, logs to the
      # container's stdout where `docker logs` can read them, and the demo
      # sign-in off.
      APP_ENV: production
      APP_DEBUG: "false"
      LOG_CHANNEL: stderr
      LOG_LEVEL: warning
      DEMO_LOGIN_ENABLED: "false"

      # Sessions, cache and queue on the database, which is why there is no
      # Redis container: all three are small here and a third service would
      # be one more thing to run for no gain.
      SESSION_DRIVER: database
      CACHE_STORE: database
      QUEUE_CONNECTION: database

      # Migrations run on boot. Set to false to start without them.
      RUN_MIGRATIONS: "${DOCKER_RUN_MIGRATIONS:-true}"

    ports:
      # Host 8002, leaving 8001 to `php artisan serve`.
      #
      # It sat on 8001 for a while, because that is the address registered
      # with Google as an authorised redirect and sign-in is the only way
      # into this application. It also meant the containers answered every
      # time the local address was opened, which is the address the day's
      # work is done on.
      #
      # So the trade runs the other way: Google sign-in works against
      # `artisan serve` on 8001 and not against these containers, which are
      # for trying the deployment shape rather than for signing in. To sign
      # in here instead, add http://localhost:8002/auth/google/callback to
      # the OAuth client's authorised redirect URIs.
      - "${DOCKER_APP_PORT:-8002}:80"

    volumes:
      # Uploaded evidence. This is the one directory whose contents must
      # survive the container: everything else in the image is rebuilt, and
      # a student's attachment that lives only inside a layer is gone with
      # the next deploy.
      - concern-storage:/var/www/html/storage/app

    # Start order only, with no wait on the database being healthy.
    #
    # `condition: service_healthy` was here, and it broke the play button in
    # Docker Desktop: that button runs `docker compose start`, which checks
    # the condition at once instead of waiting on it the way `up` does.
    # MySQL takes about fifteen seconds to answer, so the check failed, the
    # stack was torn down again, and the error named a dependency rather
    # than the timing.
    #
    # Nothing is lost by dropping it. docker/entrypoint.sh opens a socket to
    # the database and waits up to two minutes before it runs a migration --
    # the compose-level gate was the same wait written twice, and the second
    # copy is the one that could fail.
    depends_on:
      - db

    networks:
      - cspcconcern

  db:
    image: mysql:8.0
    container_name: cspcconcern-db
    restart: unless-stopped

    # The same three values as the app service above, for the same reason:
    # Compose substitutes from .env, which now holds the XAMPP settings, so
    # a ${DB_USERNAME:-cspcconcern} here asked this image to create a user
    # called "root" -- which it refuses, because root already exists.
    environment:
      MYSQL_DATABASE: "${DOCKER_DB_DATABASE:-cspcconcern}"
      MYSQL_USER: "${DOCKER_DB_USERNAME:-cspcconcern}"
      MYSQL_PASSWORD: "${DOCKER_DB_PASSWORD:-secret}"
      MYSQL_ROOT_PASSWORD: "${DOCKER_DB_ROOT_PASSWORD:-root}"

    # utf8mb4 end to end. The default collation would mangle a name with an
    # ñ in it, and this roster is full of them.
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci

    volumes:
      - concern-db:/var/lib/mysql

    # The app waits on this rather than on the port opening: MySQL listens
    # for several seconds before it will accept a query.
    healthcheck:
      # Literal, like the credentials above: DB_ROOT_PASSWORD no longer
      # exists anywhere now that .env.docker is gone, and a substitution
      # that silently falls back to its default is a thing that looks
      # configurable and is not.
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-p${DOCKER_DB_ROOT_PASSWORD:-root}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

    networks:
      - cspcconcern

    # Published only so a client like phpMyAdmin or Workbench can reach it
    # while you are working. Remove this block on a real host: a database
    # that answers the internet is a database somebody else is reading.
    ports:
      - "${DOCKER_DB_PORT:-3307}:3306"

volumes:
  concern-storage:
  concern-db:

networks:
  cspcconcern:
    driver: bridge
